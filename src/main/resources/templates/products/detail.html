<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head(${product.name})}"></head>
  <body>
    <nav th:replace="~{fragments/navbar :: nav}"></nav>
    <main class="container py-5">
      <div
        class="alert alert-success"
        th:if="${success}"
        th:text="${success}"
      ></div>
      <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
      <div class="row g-5">
        <div class="col-md-6">
          <img
            class="detail-img w-100"
            th:src="${product.imageUrl}"
            th:alt="${product.name}"
          />
        </div>
        <div class="col-md-6">
          <span class="badge pill mb-2" th:text="${product.category.name}"
            >Danh mục</span
          >
          <h1 class="fw-bold" th:text="${product.name}">Sản phẩm</h1>
          <p class="text-muted" th:text="${product.description}"></p>
          <p
            class="price display-6"
            th:text="${#numbers.formatDecimal(product.price,0,'COMMA',0,'POINT')}+' đ'"
          ></p>
          <div class="panel p-3 mb-3">
            <h2 class="h6">Chọn chi nhánh & tồn kho</h2>
            <form th:action="@{/cart/items}" method="post">
              <input type="hidden" name="productId" th:value="${product.id}" />
              <div class="mb-3" th:each="s,iter:${stocks}">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="branchId"
                    th:value="${s.branch.id}"
                    th:id="|branch${s.id}|"
                    th:checked="${iter.first}"
                    required
                  /><label
                    class="form-check-label w-100"
                    th:for="|branch${s.id}|"
                    ><span th:text="${s.branch.name}">Chi nhánh</span
                    ><span
                      class="float-end text-success"
                      th:text="|Còn ${s.quantity}|"
                    ></span
                  ></label>
                </div>
              </div>
              <div class="d-flex gap-2">
                <input
                  class="form-control"
                  type="number"
                  name="quantity"
                  min="1"
                  value="1"
                  style="max-width: 100px"
                /><button class="btn btn-primary flex-grow-1">
                  Thêm vào giỏ
                </button>
              </div>
            </form>
          </div>
          <p class="small text-muted mb-0">
            SKU: <span th:text="${product.sku}"></span> · Hỗ trợ COD và nhận tại
            cửa hàng.
          </p>
        </div>
      </div>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </body>
</html>
