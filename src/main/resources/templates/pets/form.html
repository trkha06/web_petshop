// File: src/main/resources/templates/pets/form.html
<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head(${isEdit} ? 'Chỉnh sửa thú cưng' : 'Thêm thú cưng mới')}"></head>
  <body class="bg-light">
    <div th:replace="~{fragments/navbar :: nav}"></div>

    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <a th:href="@{/pets}" class="btn btn-link text-decoration-none ps-0 mb-3">← Quay lại danh sách thú cưng</a>

          <!-- Flash Messages -->
          <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>

          <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-header bg-white p-4 border-bottom">
              <h4 class="fw-bold mb-0 text-primary" th:text="${isEdit} ? '✏️ Cập Nhật Hồ Sơ Thú Cưng' : '➕ Thêm Hồ Sơ Thú Cưng Mới'"></h4>
            </div>

            <div class="card-body p-4">
              <form th:action="${isEdit} ? @{'/pets/' + ${petId} + '/edit'} : @{/pets/new}" method="post">
                <div class="mb-3">
                  <label class="form-label fw-semibold">Tên thú cưng <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" name="name" th:value="${pet.name}" required placeholder="Ví dụ: Milo, Bánh Bao, Miu Miu">
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-sm-6">
                    <label class="form-label fw-semibold">Loài <span class="text-danger">*</span></label>
                    <select class="form-select" name="petType" required>
                      <option th:each="t : ${petTypes}" th:value="${t}" th:text="${t}" th:selected="${pet.petType == t}"></option>
                    </select>
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label fw-semibold">Giống loài</label>
                    <input type="text" class="form-control" name="breed" th:value="${pet.breed}" placeholder="Ví dụ: Golden Retriever, Mèo Anh Lông Ngắn">
                  </div>
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-sm-6">
                    <label class="form-label fw-semibold">Giới tính</label>
                    <select class="form-select" name="gender">
                      <option value="Đực" th:selected="${pet.gender == 'Đực'}">Đực</option>
                      <option value="Cái" th:selected="${pet.gender == 'Cái'}">Cái</option>
                    </select>
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label fw-semibold">Cân nặng (kg)</label>
                    <input type="number" step="0.1" class="form-control" name="weight" th:value="${pet.weight}" placeholder="Ví dụ: 4.5">
                  </div>
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-sm-6">
                    <label class="form-label fw-semibold">Ngày sinh / Ước tính</label>
                    <input type="date" class="form-control" name="birthday" th:value="${pet.birthday}">
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label fw-semibold">URL Ảnh thú cưng</label>
                    <input type="url" class="form-control" name="imageUrl" th:value="${pet.imageUrl}" placeholder="https://...">
                  </div>
                </div>

                <div class="mb-4">
                  <label class="form-label fw-semibold">Ghi chú đặc biệt</label>
                  <textarea class="form-control" name="note" rows="3" th:text="${pet.note}" placeholder="Tập tính, dị ứng thực phẩm, tiêm phòng..."></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                  <a th:href="@{/pets}" class="btn btn-secondary">Hủy bỏ</a>
                  <button type="submit" class="btn btn-primary px-4 fw-bold">Lưu Hồ Sơ</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
