<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head(${isEdit} ? 'Chỉnh Sửa Hồ Sơ Thú Cưng' : 'Thêm Thú Cưng Mới')}"></head>
  <body>
    <header th:replace="~{fragments/navbar :: nav}"></header>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <a th:href="@{/pets}" class="btn btn-link text-decoration-none ps-0 mb-3 text-secondary">
            <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách thú cưng
          </a>

          
          <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-4 p-3 shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>

          <div class="panel p-4 p-md-5">
            <div class="pb-3 border-bottom mb-4">
              <span class="badge bg-primary-subtle text-primary fw-bold rounded-pill px-3 py-1 mb-2">🐾 Thông Tin Thú Cưng</span>
              <h2 class="h4 fw-bold mb-0 text-dark" th:text="${isEdit} ? '✏️ Cập Nhật Hồ Sơ Bé Cưng' : '➕ Tạo Hồ Sơ Bé Cưng Mới'"></h2>
            </div>

            <form th:action="${isEdit} ? @{/pets/{id}/edit(id=${petId})} : @{/pets/new}" method="post">
              <div class="mb-3">
                <label class="form-label fw-bold">Tên thú cưng <span class="text-danger">*</span></label>
                <input type="text" class="form-control form-control-lg" name="name" th:value="${pet.name}" required placeholder="Ví dụ: Milo, Bánh Bao, Miu Miu, Corgi Kem...">
              </div>

              <div class="row g-3 mb-3">
                <div class="col-sm-6">
                  <label class="form-label fw-bold">Loài thú cưng <span class="text-danger">*</span></label>
                  <select class="form-select form-select-lg" name="petType" required>
                    <option th:each="t : ${petTypes}" th:value="${t}" th:text="${t}" th:selected="${pet.petType == t}"></option>
                  </select>
                </div>
                <div class="col-sm-6">
                  <label class="form-label fw-bold">Giống loài cụ thể</label>
                  <input type="text" class="form-control form-control-lg" name="breed" th:value="${pet.breed}" placeholder="Ví dụ: Golden, Poodle, Mèo Anh Lông Ngắn...">
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-sm-6">
                  <label class="form-label fw-bold">Giới tính</label>
                  <select class="form-select form-select-lg" name="gender">
                    <option value="Đực" th:selected="${pet.gender == 'Đực'}">Đực ♂</option>
                    <option value="Cái" th:selected="${pet.gender == 'Cái'}">Cái ♀</option>
                  </select>
                </div>
                <div class="col-sm-6">
                  <label class="form-label fw-bold">Cân nặng (kg)</label>
                  <input type="number" step="0.1" class="form-control form-control-lg" name="weight" th:value="${pet.weight}" placeholder="Ví dụ: 4.5">
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-sm-6">
                  <label class="form-label fw-bold">Ngày sinh / Ngày nhận nuôi</label>
                  <input type="date" class="form-control form-control-lg" name="birthday" th:value="${pet.birthday}">
                </div>
                <div class="col-sm-6">
                  <label class="form-label fw-bold">Link Ảnh Thú Cưng (URL)</label>
                  <input type="url" class="form-control form-control-lg" name="imageUrl" th:value="${pet.imageUrl}" placeholder="https://images.unsplash.com/...">
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label fw-bold">Ghi chú sức khỏe & tập tính</label>
                <textarea class="form-control" name="note" rows="3" th:text="${pet.note}" placeholder="Bé nhát người lạ, sợ sấy lông, dị ứng thức ăn có gà, đã tiêm phòng dại..."></textarea>
              </div>

              <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                <a th:href="@{/pets}" class="btn btn-outline-secondary rounded-pill px-4">Hủy bỏ</a>
                <button type="submit" class="btn btn-primary rounded-pill px-5 fw-bold shadow-sm">
                  Lưu Hồ Sơ 🐾
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </body>
</html>
