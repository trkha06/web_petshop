// File: src/main/resources/templates/pets/list.html
<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head('Hồ sơ thú cưng')}"></head>
  <body class="bg-light">
    <div th:replace="~{fragments/navbar :: nav}"></div>

    <div class="container my-5">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
          <h3 class="fw-bold mb-1">🐾 Danh Sách Thú Cưng Của Tôi</h3>
          <p class="text-muted mb-0">Quản lý hồ sơ sức khỏe và thông tin các bé cưng trong gia đình</p>
        </div>
        <a th:href="@{/pets/new}" class="btn btn-primary fw-semibold">+ Thêm Thú Cưng</a>
      </div>

      <!-- Flash Messages -->
      <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <div th:if="${pets.empty}" class="card border-0 shadow-sm p-5 text-center">
        <div class="fs-1 mb-2">🐶🐱</div>
        <h5 class="text-muted">Bạn chưa thêm bé cưng nào</h5>
        <div class="mt-3">
          <a th:href="@{/pets/new}" class="btn btn-primary">Thêm thú cưng ngay</a>
        </div>
      </div>

      <div th:unless="${pets.empty}" class="row g-4">
        <div th:each="p : ${pets}" class="col-sm-6 col-lg-4">
          <div class="card border-0 shadow-sm rounded-4 overflow-hidden h-100">
            <img th:src="${p.imageUrl != null ? p.imageUrl : 'https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=800&q=80'}" 
                 class="card-img-top" style="height: 200px; object-fit: cover;" th:alt="${p.name}">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="card-title fw-bold mb-0 text-primary" th:text="${p.name}"></h5>
                <span class="badge bg-secondary" th:text="${p.petType}"></span>
              </div>
              <p class="text-muted small mb-2">
                Giống loài: <strong class="text-dark" th:text="${p.breed != null ? p.breed : 'Đang cập nhật'}"></strong>
              </p>
              <div class="row g-2 small text-muted mb-3">
                <div class="col-6">Giới tính: <strong class="text-dark" th:text="${p.gender != null ? p.gender : '---'}"></strong></div>
                <div class="col-6">Cân nặng: <strong class="text-dark" th:text="${p.weight != null ? p.weight + ' kg' : '---'}"></strong></div>
              </div>
              <p th:if="${p.note}" class="small text-secondary bg-light p-2 rounded" th:text="${p.note}"></p>

              <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                <a th:href="@{'/pets/' + ${p.id} + '/edit'}" class="btn btn-outline-secondary btn-sm">Chỉnh sửa</a>
                <a th:href="@{'/bookings/create?petId=' + ${p.id}}" class="btn btn-primary btn-sm">Đặt lịch hẹn</a>
                <form th:action="@{'/pets/' + ${p.id} + '/delete'}" method="post" onsubmit="return confirm('Bạn có chắc muốn xóa hồ sơ này?');">
                  <button type="submit" class="btn btn-outline-danger btn-sm">Xóa</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
