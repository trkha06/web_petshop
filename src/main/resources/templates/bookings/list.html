// File: src/main/resources/templates/bookings/list.html
<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head('Lịch đặt hẹn của tôi')}"></head>
  <body class="bg-light">
    <div th:replace="~{fragments/navbar :: nav}"></div>

    <div class="container my-5">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
          <h3 class="fw-bold mb-1">📅 Lịch Đặt Chăm Sóc Thú Cưng</h3>
          <p class="text-muted mb-0">Theo dõi tiến độ và lịch sử chăm sóc của các bé cưng</p>
        </div>
        <a th:href="@{/bookings/create}" class="btn btn-primary fw-semibold">
          + Đặt Lịch Hẹn Mới
        </a>
      </div>

      <!-- Flash Messages -->
      <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <div th:if="${bookings.empty}" class="card border-0 shadow-sm p-5 text-center">
        <div class="fs-1 mb-2">🐾</div>
        <h5 class="text-muted">Bạn chưa có lịch hẹn nào</h5>
        <div class="mt-3">
          <a th:href="@{/bookings/create}" class="btn btn-primary">Đặt lịch ngay</a>
        </div>
      </div>

      <div th:unless="${bookings.empty}" class="row g-3">
        <div th:each="b : ${bookings}" class="col-md-6 col-lg-4">
          <div class="card border-0 shadow-sm rounded-3 h-100">
            <div class="card-header bg-white border-bottom-0 pt-3 pb-0 d-flex justify-content-between align-items-center">
              <span class="badge bg-secondary font-monospace" th:text="${b.code}"></span>
              <span th:class="'badge ' + 
                    (${b.status.name() == 'PENDING'} ? 'bg-warning text-dark' : 
                    (${b.status.name() == 'CONFIRMED'} ? 'bg-info text-dark' : 
                    (${b.status.name() == 'CHECKED_IN'} ? 'bg-primary' : 
                    (${b.status.name() == 'IN_PROGRESS'} ? 'bg-purple text-white' : 
                    (${b.status.name() == 'COMPLETED'} ? 'bg-success' : 'bg-danger')))))"
                    th:text="${b.status}"></span>
            </div>
            <div class="card-body">
              <h5 class="card-title fw-bold text-primary mb-1" th:text="${b.serviceName}"></h5>
              <div class="text-muted small mb-3">
                Thú cưng: <strong class="text-dark" th:text="${b.petName}"></strong>
              </div>

              <div class="bg-light p-2 rounded-2 small mb-3">
                <div>📍 <span th:text="${b.branchName}"></span></div>
                <div>🕒 <span th:text="${#temporals.format(b.slotDate, 'dd/MM/yyyy')}"></span> (<span th:text="${b.startTime} + ' - ' + ${b.endTime}"></span>)</div>
                <div>💰 <strong class="text-danger" th:text="${#numbers.formatDecimal(b.totalPrice, 0, 'COMMA', 0, 'POINT')} + 'đ'"></strong></div>
              </div>

              <div class="d-flex justify-content-between align-items-center">
                <a th:href="@{'/bookings/' + ${b.id}}" class="btn btn-outline-secondary btn-sm">Xem chi tiết</a>
                <form th:if="${b.status.name() == 'PENDING' or b.status.name() == 'CONFIRMED'}" 
                      th:action="@{'/bookings/' + ${b.id} + '/cancel'}" method="post" 
                      onsubmit="return confirm('Bạn có chắc chắn muốn hủy lịch hẹn này?');">
                  <button type="submit" class="btn btn-outline-danger btn-sm">Hủy lịch</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
