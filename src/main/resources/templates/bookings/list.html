<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head('Lịch Hẹn Của Tôi')}"></head>
  <body>
    <header th:replace="~{fragments/navbar :: nav}"></header>

    <main class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
          <span class="badge bg-primary-subtle text-primary fw-bold rounded-pill px-3 py-1 mb-2">🐾 Lịch Sử Spa & Chăm Sóc</span>
          <h1 class="h3 fw-bold mb-1">Lịch Hẹn Chăm Sóc Thú Cưng</h1>
          <p class="text-secondary small mb-0">Theo dõi tiến độ, chi tiết dịch vụ và lịch sử làm đẹp của các bé</p>
        </div>
        <a th:href="@{/bookings/create}" class="btn btn-cta-book rounded-pill px-4 py-2 fw-bold shadow-sm">
          <i class="bi bi-plus-lg me-1"></i> Đặt Lịch Hẹn Mới
        </a>
      </div>

      
      <div th:if="${success}" class="alert alert-success alert-dismissible fade show rounded-4 p-3 shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-4 p-3 shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      
      <div th:if="${bookings.empty}" class="panel p-5 text-center my-4">
        <div class="fs-1 mb-2">🐾</div>
        <h5 class="fw-bold text-muted">Bạn chưa có lịch hẹn nào</h5>
        <p class="text-secondary small mb-3">Hãy đặt ngay một buổi spa thư giãn để bé cưng luôn sạch thơm và khỏe mạnh nhé!</p>
        <div>
          <a th:href="@{/bookings/create}" class="btn btn-primary rounded-pill px-4">Đặt lịch cho bé ngay</a>
        </div>
      </div>

      
      <div th:unless="${bookings.empty}" class="row g-4">
        <div th:each="b : ${bookings}" class="col-md-6 col-lg-4">
          <article class="panel p-4 h-100 d-flex flex-column">
            <div class="d-flex justify-content-between align-items-center pb-3 border-bottom mb-3">
              <span class="badge bg-light text-dark border font-monospace px-2 py-1" th:text="${b.code}"></span>
              <span th:class="'badge rounded-pill px-3 py-2 ' + 
                    (${b.status.name() == 'PENDING'} ? 'bg-warning text-dark' : 
                    (${b.status.name() == 'CONFIRMED'} ? 'bg-info text-dark' : 
                    (${b.status.name() == 'CHECKED_IN'} ? 'bg-primary' : 
                    (${b.status.name() == 'IN_PROGRESS'} ? 'bg-info text-white' : 
                    (${b.status.name() == 'COMPLETED'} ? 'bg-success' : 'bg-danger')))))"
                    th:text="${b.status}"></span>
            </div>

            <div class="flex-grow-1">
              <h4 class="h5 fw-bold text-primary mb-1" th:text="${b.serviceName}"></h4>
              <div class="small text-muted mb-3">
                <i class="bi bi-heart-fill text-danger me-1"></i> Bé cưng: <strong class="text-dark" th:text="${b.petName}"></strong>
              </div>

              <div class="bg-light p-3 rounded-4 small mb-3">
                <div class="mb-1"><i class="bi bi-geo-alt-fill text-primary me-1"></i> <span th:text="${b.branchName}"></span></div>
                <div class="mb-1"><i class="bi bi-calendar-event me-1 text-primary"></i> <span th:text="${#temporals.format(b.slotDate, 'dd/MM/yyyy')}"></span> (<span th:text="|${b.startTime} - ${b.endTime}|"></span>)</div>
                <div><i class="bi bi-cash me-1 text-success"></i> Tổng phí: <strong class="price text-danger" th:text="${#numbers.formatDecimal(b.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></strong></div>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center pt-2 border-top mt-auto">
              <a th:href="@{'/bookings/' + ${b.id}}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">Chi tiết</a>
              <form th:if="${b.status.name() == 'PENDING' or b.status.name() == 'CONFIRMED'}" 
                    th:action="@{'/bookings/' + ${b.id} + '/cancel'}" method="post" 
                    onsubmit="return confirm('Bạn có chắc chắn muốn hủy lịch hẹn này?');">
                <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3">Hủy lịch</button>
              </form>
            </div>
          </article>
        </div>
      </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </body>
</html>
