// File: src/main/resources/templates/bookings/detail.html
<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head('Chi tiết lịch hẹn')}"></head>
  <body class="bg-light">
    <div th:replace="~{fragments/navbar :: nav}"></div>

    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <a th:href="@{/bookings}" class="btn btn-link text-decoration-none ps-0 mb-3">← Quay lại danh sách lịch hẹn</a>

          <!-- Flash Messages -->
          <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
          <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>

          <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-header bg-white p-4 border-bottom d-flex justify-content-between align-items-center flex-wrap gap-2">
              <div>
                <span class="text-muted small">Mã lịch hẹn:</span>
                <h4 class="fw-bold mb-0 font-monospace text-primary" th:text="${booking.code}"></h4>
              </div>
              <div>
                <span th:class="'badge fs-6 px-3 py-2 ' + 
                      (${booking.status.name() == 'PENDING'} ? 'bg-warning text-dark' : 
                      (${booking.status.name() == 'CONFIRMED'} ? 'bg-info text-dark' : 
                      (${booking.status.name() == 'CHECKED_IN'} ? 'bg-primary' : 
                      (${booking.status.name() == 'IN_PROGRESS'} ? 'bg-secondary' : 
                      (${booking.status.name() == 'COMPLETED'} ? 'bg-success' : 'bg-danger')))))"
                      th:text="${booking.status}"></span>
              </div>
            </div>

            <div class="card-body p-4">
              <h5 class="fw-bold text-dark border-bottom pb-2 mb-3">Thông Tin Lịch Hẹn</h5>
              <div class="row g-3 mb-4">
                <div class="col-sm-6">
                  <div class="text-muted small">Dịch vụ chăm sóc:</div>
                  <strong class="fs-5 text-primary" th:text="${booking.serviceName}"></strong>
                </div>
                <div class="col-sm-6">
                  <div class="text-muted small">Thú cưng thực hiện:</div>
                  <strong class="fs-5" th:text="${booking.petName}"></strong>
                </div>
                <div class="col-sm-6">
                  <div class="text-muted small">Chi nhánh thực hiện:</div>
                  <strong th:text="${booking.branchName}"></strong>
                </div>
                <div class="col-sm-6">
                  <div class="text-muted small">Ngày & Giờ hẹn:</div>
                  <strong><span th:text="${#temporals.format(booking.slotDate, 'dd/MM/yyyy')}"></span> | <span th:text="|${booking.startTime} - ${booking.endTime}|"></span></strong>
                </div>
                <div class="col-sm-6">
                  <div class="text-muted small">Tổng chi phí (Snapshot giá):</div>
                  <strong class="text-danger fs-4" th:text="${#numbers.formatDecimal(booking.totalPrice, 0, 'COMMA', 0, 'POINT')} + 'đ'"></strong>
                </div>
                <div class="col-sm-6">
                  <div class="text-muted small">Ngày đặt:</div>
                  <span th:text="${#temporals.format(booking.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                </div>
              </div>

              <div th:if="${booking.note}" class="alert alert-light border">
                <strong>Ghi chú:</strong> <span th:text="${booking.note}"></span>
              </div>

              <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                <form th:if="${booking.status.name() == 'PENDING' or booking.status.name() == 'CONFIRMED'}" 
                      th:action="@{'/bookings/' + ${booking.id} + '/cancel'}" method="post" 
                      onsubmit="return confirm('Bạn có chắc chắn muốn hủy lịch hẹn này?');">
                  <button type="submit" class="btn btn-outline-danger">Hủy Lịch Hẹn</button>
                </form>
                <a th:href="@{/bookings}" class="btn btn-secondary">Đóng</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
