<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head('Chi Tiết Lịch Hẹn - ' + ${booking.code})}"></head>
  <body>
    <header th:replace="~{fragments/navbar :: nav}"></header>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <a th:href="@{/bookings}" class="btn btn-link text-decoration-none ps-0 mb-3 text-secondary">
            <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách lịch hẹn
          </a>

          
          <div th:if="${success}" class="alert alert-success alert-dismissible fade show rounded-4 p-3 shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
          <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-4 p-3 shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>

          <div class="panel p-4 p-md-5">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 pb-4 border-bottom mb-4">
              <div>
                <span class="text-muted small d-block">Mã lịch hẹn:</span>
                <h3 class="fw-bold mb-0 font-monospace text-primary" th:text="${booking.code}"></h3>
              </div>
              <div>
                <span th:class="'badge fs-6 rounded-pill px-3 py-2 ' + 
                      (${booking.status.name() == 'PENDING'} ? 'bg-warning text-dark' : 
                      (${booking.status.name() == 'CONFIRMED'} ? 'bg-info text-dark' : 
                      (${booking.status.name() == 'CHECKED_IN'} ? 'bg-primary' : 
                      (${booking.status.name() == 'IN_PROGRESS'} ? 'bg-secondary' : 
                      (${booking.status.name() == 'COMPLETED'} ? 'bg-success' : 'bg-danger')))))"
                      th:text="${booking.status}"></span>
              </div>
            </div>

            <h5 class="fw-bold text-dark mb-3">🐾 Thông Tin Chi Tiết Lịch Spa</h5>
            
            <div class="row g-4 mb-4">
              <div class="col-sm-6">
                <div class="p-3 bg-light rounded-4">
                  <span class="text-muted small d-block">Gói dịch vụ</span>
                  <strong class="fs-5 text-primary" th:text="${booking.serviceName}"></strong>
                </div>
              </div>
              <div class="col-sm-6">
                <div class="p-3 bg-light rounded-4">
                  <span class="text-muted small d-block">Bé cưng</span>
                  <strong class="fs-5 text-dark">🐾 <span th:text="${booking.petName}"></span></strong>
                </div>
              </div>
              <div class="col-sm-6">
                <div class="p-3 bg-light rounded-4">
                  <span class="text-muted small d-block">Chi nhánh thực hiện</span>
                  <strong class="text-dark"><i class="bi bi-geo-alt-fill text-primary me-1"></i> <span th:text="${booking.branchName}"></span></strong>
                </div>
              </div>
              <div class="col-sm-6">
                <div class="p-3 bg-light rounded-4">
                  <span class="text-muted small d-block">Khung giờ hẹn</span>
                  <strong class="text-dark"><i class="bi bi-calendar-check text-primary me-1"></i> <span th:text="${#temporals.format(booking.slotDate, 'dd/MM/yyyy')}"></span> | <span th:text="|${booking.startTime} - ${booking.endTime}|"></span></strong>
                </div>
              </div>
              <div class="col-sm-6">
                <div class="p-3 bg-light rounded-4">
                  <span class="text-muted small d-block">Tổng chi phí dự kiến</span>
                  <strong class="price text-danger fs-4" th:text="${#numbers.formatDecimal(booking.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></strong>
                </div>
              </div>
              <div class="col-sm-6">
                <div class="p-3 bg-light rounded-4">
                  <span class="text-muted small d-block">Thời điểm đặt lịch</span>
                  <span class="text-muted" th:text="${#temporals.format(booking.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                </div>
              </div>
            </div>

            <div th:if="${booking.note}" class="alert alert-light border rounded-4 p-3 mb-4">
              <strong class="text-dark"><i class="bi bi-sticky me-1 text-warning"></i> Ghi chú cho kỹ thuật viên:</strong>
              <p class="mb-0 text-secondary mt-1" th:text="${booking.note}"></p>
            </div>

            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
              <form th:if="${booking.status.name() == 'PENDING' or booking.status.name() == 'CONFIRMED'}" 
                    th:action="@{'/bookings/' + ${booking.id} + '/cancel'}" method="post" 
                    onsubmit="return confirm('Bạn có chắc chắn muốn hủy lịch hẹn này?');">
                <button type="submit" class="btn btn-outline-danger rounded-pill px-4">Hủy Lịch Hẹn</button>
              </form>
              <a th:href="@{/bookings}" class="btn btn-outline-secondary rounded-pill px-4">Quay lại</a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </body>
</html>
