<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head('Phân công nhân viên')}"></head>
  <body>
    <header th:replace="~{fragments/navbar :: nav}"></header>

    <main class="container py-5">
      <div class="mb-4">
        <span class="badge bg-success-subtle text-success fw-bold rounded-pill px-3 py-1 mb-2">Vận hành theo chi nhánh</span>
        <h1 class="h3 fw-bold mb-1">Phân công nhân viên</h1>
        <p class="text-secondary mb-0">Mỗi nhân viên chỉ xử lý đơn hàng và lịch hẹn thuộc chi nhánh được gán.</p>
      </div>

      <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
      <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

      <div class="panel p-4 mb-4">
        <h2 class="h5 fw-bold mb-3"><i class="bi bi-person-plus-fill text-success me-2"></i>Tạo tài khoản nhân viên</h2>
        <form class="row g-3" method="post" th:action="@{/manager/staff}">
          <div class="col-md-4">
            <label class="form-label small fw-semibold" for="fullName">Họ tên</label>
            <input class="form-control" id="fullName" name="fullName" maxlength="255" required />
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold" for="email">Email đăng nhập</label>
            <input class="form-control" id="email" name="email" type="email" maxlength="255" required />
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold" for="phone">Số điện thoại</label>
            <input class="form-control" id="phone" name="phone" maxlength="20" inputmode="tel" />
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold" for="password">Mật khẩu khởi tạo</label>
            <input class="form-control" id="password" name="password" type="password" minlength="8" required />
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold" for="branchId">Chi nhánh phụ trách</label>
            <select class="form-select" id="branchId" name="branchId" required>
              <option value="" selected disabled>Chọn chi nhánh</option>
              <option th:each="branch : ${branches}" th:value="${branch.id}" th:text="${branch.name}"></option>
            </select>
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <button class="btn btn-success w-100"><i class="bi bi-person-plus me-1"></i> Tạo nhân viên</button>
          </div>
        </form>
      </div>

      <div class="panel p-3 table-responsive">
        <table class="table align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Nhân viên</th>
              <th>Email</th>
              <th>Chi nhánh được gán</th>
              <th class="text-end">Cập nhật</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="staff : ${staffUsers}">
              <td><strong th:text="${staff.fullName}"></strong></td>
              <td class="text-secondary" th:text="${staff.email}"></td>
              <td>
                <span class="badge bg-success-subtle text-success" th:if="${assignedBranchIds.containsKey(staff.id)}">Đã phân công</span>
                <span class="badge bg-warning-subtle text-warning-emphasis" th:unless="${assignedBranchIds.containsKey(staff.id)}">Chưa phân công</span>
              </td>
              <td>
                <form class="d-flex justify-content-end gap-2" method="post" th:action="@{/manager/staff/{id}/branch(id=${staff.id})}">
                  <select class="form-select form-select-sm" name="branchId" required style="min-width: 230px">
                    <option value="" disabled th:selected="${!assignedBranchIds.containsKey(staff.id)}">Chọn chi nhánh</option>
                    <option th:each="branch : ${branches}" th:value="${branch.id}" th:text="${branch.name}" th:selected="${assignedBranchIds.get(staff.id) == branch.id}"></option>
                  </select>
                  <button class="btn btn-sm btn-success px-3">Lưu</button>
                </form>
              </td>
            </tr>
            <tr th:if="${staffUsers.empty}">
              <td colspan="4" class="text-center text-muted py-4">Chưa có tài khoản STAFF.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </body>
</html>
