<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head('Quản lý sản phẩm')}"></head>
  <body>
    <nav th:replace="~{fragments/navbar :: nav}"></nav>
    <main class="container py-5">
      <div class="d-flex justify-content-between mb-4">
        <h1 class="h3 fw-bold">Quản lý sản phẩm</h1>
        <a class="btn btn-primary" th:href="@{/manager/products/new}"
          >+ Thêm sản phẩm</a
        >
      </div>
      <div
        class="alert alert-success"
        th:if="${success}"
        th:text="${success}"
      ></div>
      <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
      <div class="panel p-3 table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>SKU</th>
              <th>Sản phẩm</th>
              <th>Giá</th>
              <th>Trạng thái</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="p:${products}">
              <td th:text="${p.sku}"></td>
              <td>
                <strong th:text="${p.name}"></strong>
                <div
                  class="small text-muted"
                  th:text="${p.category.name}+' · '+${p.brand.name}"
                ></div>
              </td>
              <td
                th:text="${#numbers.formatDecimal(p.price,0,'COMMA',0,'POINT')}+' đ'"
              ></td>
              <td th:text="${p.active?'ACTIVE':'INACTIVE'}"></td>
              <td class="text-end">
                <a
                  class="btn btn-sm btn-outline-success"
                  th:href="@{/manager/products/{id}/edit(id=${p.id})}"
                  >Sửa</a
                >
                <form
                  class="d-inline"
                  th:if="${p.active}"
                  th:action="@{/manager/products/{id}/deactivate(id=${p.id})}"
                  method="post"
                >
                  <button class="btn btn-sm btn-outline-danger">Ẩn</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </body>
</html>
