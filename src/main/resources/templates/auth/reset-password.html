<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head('Đặt Lại Mật Khẩu')}"></head>
  <body>
    <header th:replace="~{fragments/navbar :: nav}"></header>

    <main class="container py-5" style="max-width: 520px">
      <div class="panel p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-icon-box mx-auto mb-3" style="width: 58px; height: 58px; font-size: 1.7rem;">
            <span>🛡️</span>
          </div>
          <span class="badge bg-success bg-opacity-25 text-success fw-bold rounded-pill px-3 py-1 mb-2">Bước 2: Thiết lập mật khẩu</span>
          <h1 class="h4 fw-bold mb-1 text-dark">Đặt Lại Mật Khẩu</h1>
          <p class="text-secondary small mb-0">
            Mã OTP khôi phục đã được gửi tới email: <br>
            <strong class="text-primary" th:text="${email}">user@example.com</strong>
          </p>
        </div>

        <div class="alert alert-danger rounded-4 small p-3 mb-3" th:if="${error}" th:text="${error}"></div>
        <div class="alert alert-success rounded-4 small p-3 mb-3" th:if="${success}" th:text="${success}"></div>

        <form th:action="@{/forgot-password/reset}" method="post">
          <input type="hidden" name="email" th:value="${email}" />

          <div class="mb-3 text-center">
            <label class="form-label small fw-semibold text-secondary mb-1">Mã xác thực OTP (6 chữ số)</label>
            <input class="form-control form-control-lg text-center font-monospace fw-bold fs-3" 
                   style="letter-spacing: 8px; border-radius: 14px;"
                   type="text" 
                   name="otp" 
                   maxlength="6" 
                   pattern="[0-9]{6}"
                   inputmode="numeric"
                   required 
                   autofocus 
                   placeholder="••••••" />
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Mật khẩu mới (Tối thiểu 8 ký tự)</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-muted"></i></span>
              <input class="form-control border-start-0" type="password" name="newPassword" minlength="8" required placeholder="••••••••" />
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-semibold">Xác nhận mật khẩu mới</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-shield-check text-muted"></i></span>
              <input class="form-control border-start-0" type="password" name="confirmPassword" minlength="8" required placeholder="••••••••" />
            </div>
          </div>

          <button class="btn btn-primary btn-lg w-100 fw-bold rounded-pill shadow-sm mb-3">
            Xác Nhận Đổi Mật Khẩu 🐾
          </button>
        </form>

        <div class="d-flex justify-content-between align-items-center pt-3 border-top small">
          <a th:href="@{/login}" class="text-secondary text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i> Quay lại Đăng nhập
          </a>
          <form th:action="@{/forgot-password/resend-otp}" method="post" class="d-inline">
            <input type="hidden" name="email" th:value="${email}" />
            <button type="submit" class="btn btn-link btn-sm p-0 text-primary text-decoration-none fw-semibold">
              <i class="bi bi-arrow-clockwise me-1"></i> Gửi lại mã OTP
            </button>
          </form>
        </div>
      </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </body>
</html>
