<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head('Đăng Ký Tài Khoản')}"></head>
  <body>
    <header th:replace="~{fragments/navbar :: nav}"></header>

    <main class="container py-5" style="max-width: 520px">
      <div class="panel p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-icon-box mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.6rem;">
            <span>🐾</span>
          </div>
          <h1 class="h3 fw-bold mb-1 text-dark">Gia Nhập UTEPet</h1>
          <p class="text-secondary small mb-0">Hệ thống sẽ gửi mã xác thực OTP về email của bạn để kích hoạt tài khoản</p>
        </div>

        <div class="alert alert-danger rounded-4 small p-3 mb-3" th:if="${error}" th:text="${error}"></div>

        <form method="post" th:action="@{/register}">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Họ và tên của bạn</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-person text-muted"></i></span>
              <input class="form-control border-start-0" name="fullName" required placeholder="Nguyễn Văn A" />
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Email liên hệ</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-muted"></i></span>
              <input class="form-control border-start-0" name="email" type="email" required placeholder="name@example.com" />
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-semibold">Mật khẩu (Tối thiểu 8 ký tự)</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-muted"></i></span>
              <input class="form-control border-start-0" name="password" type="password" minlength="8" required placeholder="••••••••" />
            </div>
          </div>

          <button class="btn btn-primary btn-lg w-100 fw-bold rounded-pill shadow-sm mb-3">
            Tiếp Tục & Nhận Mã OTP 🐾
          </button>
        </form>

        <div class="text-center pt-2 border-top">
          <span class="small text-muted">Đã có tài khoản? </span>
          <a th:href="@{/login}" class="small fw-bold text-primary text-decoration-none">Đăng nhập ngay</a>
        </div>
      </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </body>
</html>
