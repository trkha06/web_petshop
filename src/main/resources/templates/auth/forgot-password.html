<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head('Quên Mật Khẩu')}"></head>
  <body>
    <header th:replace="~{fragments/navbar :: nav}"></header>

    <main class="container py-5 d-flex align-items-center justify-content-center" style="max-width: 520px; min-height: 72vh;">
      <div class="panel p-4 p-md-5 w-100">
        <div class="text-center mb-4">
          <div class="brand-icon-box mx-auto mb-3" style="width: 58px; height: 58px; font-size: 1.7rem;">
            <span>🔑</span>
          </div>
          <span class="badge bg-warning bg-opacity-25 text-dark fw-bold rounded-pill px-3 py-1 mb-2">Khôi phục tài khoản</span>
          <h1 class="h4 fw-bold mb-1 text-dark">Quên Mật Khẩu?</h1>
          <p class="text-secondary small mb-0">
            Nhập email tài khoản của bạn, chúng tôi sẽ gửi mã OTP 6 chữ số để bạn thiết lập lại mật khẩu mới.
          </p>
        </div>

        <div class="alert alert-danger rounded-4 small p-3 mb-3" th:if="${error}" th:text="${error}"></div>
        <div class="alert alert-success rounded-4 small p-3 mb-3" th:if="${success}" th:text="${success}"></div>

        <form th:action="@{/forgot-password}" method="post">
          <div class="mb-4">
            <label class="form-label small fw-semibold">Email tài khoản</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-muted"></i></span>
              <input class="form-control border-start-0" type="email" name="email" required autofocus placeholder="name@example.com" />
            </div>
          </div>

          <button class="btn btn-primary btn-lg w-100 fw-bold rounded-pill shadow-sm mb-3">
            Gửi Mã OTP Qua Email 🐾
          </button>
        </form>

        <div class="text-center pt-2 border-top">
          <a th:href="@{/login}" class="small text-secondary text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i> Quay lại trang Đăng nhập
          </a>
        </div>
      </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </body>
</html>
