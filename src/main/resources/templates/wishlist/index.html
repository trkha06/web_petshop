// File: src/main/resources/templates/wishlist/index.html
<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head('Sản phẩm yêu thích')}"></head>
  <body class="bg-light">
    <div th:replace="~{fragments/navbar :: nav}"></div>

    <div class="container my-5">
      <div class="mb-4">
        <h3 class="fw-bold mb-1">❤️ Danh Sách Sản Phẩm Yêu Thích</h3>
        <p class="text-muted mb-0">Lưu lại các sản phẩm bạn quan tâm để mua sắm thuận tiện hơn</p>
      </div>

      <!-- Flash Messages -->
      <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <div th:if="${products.empty}" class="card border-0 shadow-sm p-5 text-center">
        <div class="fs-1 mb-2">🎁</div>
        <h5 class="text-muted">Danh sách yêu thích của bạn đang trống</h5>
        <div class="mt-3">
          <a th:href="@{/products}" class="btn btn-primary">Khám phá sản phẩm</a>
        </div>
      </div>

      <div th:unless="${products.empty}" class="row g-4">
        <div th:each="p : ${products}" class="col-sm-6 col-md-4 col-lg-3">
          <div class="card border-0 shadow-sm rounded-4 overflow-hidden h-100 d-flex flex-column">
            <img th:src="${p.imageUrl}" class="card-img-top" style="height: 180px; object-fit: cover;" th:alt="${p.name}">
            <div class="card-body d-flex flex-column">
              <h6 class="card-title fw-bold mb-1" th:text="${p.name}"></h6>
              <div class="small text-muted mb-2" th:text="${p.brand}"></div>
              <div class="mt-auto pt-2">
                <div class="fs-5 fw-bold text-danger mb-3" th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></div>
                <div class="d-flex gap-2">
                  <a th:href="@{'/products/' + ${p.id}}" class="btn btn-outline-primary btn-sm flex-grow-1">Xem</a>
                  <form th:action="@{'/wishlist/' + ${p.id} + '/toggle'}" method="post">
                    <button type="submit" class="btn btn-outline-danger btn-sm" title="Xóa khỏi yêu thích">🗑️</button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
