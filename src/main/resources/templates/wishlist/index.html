<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head('Danh Sách Yêu Thích')}"></head>
  <body>
    <header th:replace="~{fragments/navbar :: nav}"></header>

    <main class="container py-5">
      <div class="mb-4">
        <span class="badge bg-danger-subtle text-danger fw-bold rounded-pill px-3 py-1 mb-2">❤️ Wishlist Của Bạn</span>
        <h1 class="h3 fw-bold mb-1">Sản Phẩm Yêu Thích</h1>
        <p class="text-secondary small mb-0">Lưu lại những món đồ dinh dưỡng và phụ kiện yêu thích để mua sắm thuận tiện nhất</p>
      </div>

      
      <div th:if="${success}" class="alert alert-success alert-dismissible fade show rounded-4 p-3 shadow-sm mb-4" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-4 p-3 shadow-sm mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      
      <div th:if="${products.empty}" class="panel p-5 text-center my-4">
        <div class="fs-1 mb-2">🎁</div>
        <h5 class="fw-bold text-muted mb-2">Danh sách yêu thích của bạn đang trống</h5>
        <p class="text-secondary small mb-3">Hãy ghé qua gian hàng để thả tim những sản phẩm bổ dưỡng cho bé cưng nhé!</p>
        <div>
          <a th:href="@{/products#shop}" class="btn btn-primary rounded-pill px-4">Khám phá sản phẩm ngay</a>
        </div>
      </div>

      
      <div th:unless="${products.empty}" class="row g-4">
        <div th:each="p : ${products}" class="col-sm-6 col-md-4 col-lg-3">
          <article class="product-card h-100">
            <div class="product-img-wrapper">
              <img th:src="${p.imageUrl}" th:alt="${p.name}">
            </div>
            <div class="card-body p-3 p-md-4 d-flex flex-column">
              <span class="text-muted small text-uppercase mb-1" th:text="${p.brand}"></span>
              <h3 class="h6 fw-bold mb-2 text-dark" style="min-height: 40px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;" th:text="${p.name}"></h3>
              
              <div class="mt-auto pt-3 border-top">
                <div class="price mb-3" th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></div>
                <div class="d-flex gap-2">
                  <a th:href="@{'/products/' + ${p.id}}" class="btn btn-outline-primary btn-sm rounded-pill flex-grow-1">Xem</a>
                  <form th:action="@{'/wishlist/' + ${p.id} + '/toggle'}" method="post">
                    <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3" title="Xóa khỏi yêu thích">
                      <i class="bi bi-trash"></i>
                    </button>
                  </form>
                </div>
              </div>
            </div>
          </article>
        </div>
      </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </body>
</html>
