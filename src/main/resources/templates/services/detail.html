// File: src/main/resources/templates/services/detail.html
<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head(${service.name})}"></head>
  <body class="bg-light">
    <div th:replace="~{fragments/navbar :: nav}"></div>

    <div class="container my-5">
      <a th:href="@{/services}" class="btn btn-link text-decoration-none ps-0 mb-3">← Quay lại danh sách dịch vụ</a>

      <div class="row g-4">
        <div class="col-lg-6">
          <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <img th:src="${service.imageUrl != null ? service.imageUrl : 'https://images.unsplash.com/photo-1516734212186-a967f81ad0d7?auto=format&fit=crop&w=800&q=80'}" 
                 class="img-fluid w-100" style="max-height: 420px; object-fit: cover;" th:alt="${service.name}">
          </div>
        </div>

        <div class="col-lg-6">
          <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 h-100 d-flex flex-column justify-content-between">
            <div>
              <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="badge bg-primary px-3 py-2 fs-6" th:if="${service.petType}" th:text="'Dành cho: ' + ${service.petType}"></span>
                <span class="text-muted">Thời lượng: <strong th:text="${service.durationMinutes} + ' phút'"></strong></span>
              </div>
              <h2 class="fw-bold text-dark mb-3" th:text="${service.name}"></h2>
              <h3 class="text-danger fw-bold mb-4" th:text="${#numbers.formatDecimal(service.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></h3>
              
              <div class="text-secondary mb-4 leading-relaxed" th:text="${service.description}"></div>
            </div>

            <div>
              <div class="d-grid gap-2">
                <a th:href="@{'/bookings/create?serviceId=' + ${service.id}}" class="btn btn-primary btn-lg fw-bold py-3">
                  🐾 Đặt Lịch Dịch Vụ Ngay
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Phần đánh giá dịch vụ -->
      <div class="mt-5">
        <div class="card border-0 shadow-sm rounded-4 p-4">
          <h4 class="fw-bold mb-4">⭐ Đánh Giá Từ Khách Hàng</h4>
          <div th:if="${reviews.empty}" class="text-muted py-3">Chưa có đánh giá nào cho dịch vụ này.</div>
          <div th:unless="${reviews.empty}">
            <div th:each="r : ${reviews}" class="border-bottom py-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <strong th:text="${r.userFullName}"></strong>
                <span class="text-warning">
                  <span th:each="i : ${#numbers.sequence(1, r.rating)}">★</span>
                </span>
              </div>
              <p class="mb-1 text-secondary" th:text="${r.comment}"></p>
              <span class="small text-muted" th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
