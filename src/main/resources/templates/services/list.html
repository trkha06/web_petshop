// File: src/main/resources/templates/services/list.html
<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head('Dịch vụ chăm sóc thú cưng')}"></head>
  <body class="bg-light">
    <div th:replace="~{fragments/navbar :: nav}"></div>

    <div class="container my-5">
      <div class="text-center mb-5">
        <h2 class="fw-bold text-primary">✨ Dịch Vụ Chăm Sóc & Làm Đẹp Thú Cưng</h2>
        <p class="text-muted">Đội ngũ kỹ thuật viên chuyên nghiệp, yêu thương động vật và trang thiết bị hiện đại</p>
      </div>

      <div th:if="${services.empty}" class="card border-0 shadow-sm p-5 text-center">
        <h5 class="text-muted">Hiện chưa có gói dịch vụ nào hoạt động</h5>
      </div>

      <div th:unless="${services.empty}" class="row g-4">
        <div th:each="s : ${services}" class="col-md-6 col-lg-4">
          <div class="card border-0 shadow-sm rounded-4 overflow-hidden h-100 d-flex flex-column">
            <img th:src="${s.imageUrl != null ? s.imageUrl : 'https://images.unsplash.com/photo-1516734212186-a967f81ad0d7?auto=format&fit=crop&w=800&q=80'}" 
                 class="card-img-top" style="height: 220px; object-fit: cover;" th:alt="${s.name}">
            <div class="card-body d-flex flex-column">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="card-title fw-bold text-dark mb-0" th:text="${s.name}"></h5>
                <span class="badge bg-info text-dark" th:if="${s.petType}" th:text="${s.petType}"></span>
              </div>
              <p class="text-muted small flex-grow-1" th:text="${s.description}"></p>
              
              <div class="d-flex justify-content-between align-items-center my-3 py-2 border-top border-bottom">
                <div>⏱️ <span class="small text-muted" th:text="${s.durationMinutes} + ' phút'"></span></div>
                <div class="fs-5 fw-bold text-danger" th:text="${#numbers.formatDecimal(s.price, 0, 'COMMA', 0, 'POINT')} + 'đ'"></div>
              </div>

              <div class="d-flex gap-2">
                <a th:href="@{'/services/' + ${s.id}}" class="btn btn-outline-secondary w-50">Chi tiết</a>
                <a th:href="@{'/bookings/create?serviceId=' + ${s.id}}" class="btn btn-primary w-50 fw-semibold">Đặt lịch ngay</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
