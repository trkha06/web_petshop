<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head('Đơn hàng')}"></head>
  <body>
    <nav th:replace="~{fragments/navbar :: nav}"></nav>
    <main class="container py-5">
      <h1 class="h3 fw-bold mb-4">Đơn hàng của tôi</h1>
      <div class="panel p-3">
        <div class="table-responsive">
          <table class="table mb-0">
            <thead>
              <tr>
                <th>Mã đơn</th>
                <th>Chi nhánh</th>
                <th>Trạng thái</th>
                <th>Tổng tiền</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="o:${orders}">
                <td th:text="|#${o.id}|"></td>
                <td th:text="${o.branch.name}"></td>
                <td>
                  <span
                    class="badge text-bg-success"
                    th:text="${o.status}"
                  ></span>
                </td>
                <td
                  th:text="${#numbers.formatDecimal(o.totalAmount,0,'COMMA',0,'POINT')}+' đ'"
                ></td>
                <td>
                  <a
                    class="btn btn-sm btn-outline-success"
                    th:href="@{/orders/{id}(id=${o.id})}"
                    >Chi tiết</a
                  >
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <p class="text-center text-muted py-4 mb-0" th:if="${orders.empty}">
          Bạn chưa có đơn hàng nào.
        </p>
      </div>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </body>
</html>
