<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head('Đơn Hàng Của Tôi')}"></head>
  <body>
    <header th:replace="~{fragments/navbar :: nav}"></header>

    <main class="container py-5">
      <div class="mb-4">
        <span class="badge bg-primary-subtle text-primary fw-bold rounded-pill px-3 py-1 mb-2">📦 Quản Lý Mua Hàng</span>
        <h1 class="h3 fw-bold mb-1">Đơn Hàng Của Tôi</h1>
        <p class="text-secondary small mb-0">Theo dõi trạng thái giao hàng và lịch sử mua sắm đồ dùng cho thú cưng</p>
      </div>

      <div class="panel p-4 p-md-5">
        <div class="table-responsive" th:if="${!orders.empty}">
          <table class="table align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th scope="col" class="py-3">Mã đơn</th>
                <th scope="col" class="py-3">Chi nhánh xử lý</th>
                <th scope="col" class="py-3">Trạng thái</th>
                <th scope="col" class="py-3">Tổng tiền</th>
                <th scope="col" class="py-3 text-end">Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="o:${orders}">
                <td class="py-3">
                  <strong class="font-monospace text-primary" th:text="|#${o.id}|"></strong>
                </td>
                <td class="text-secondary" th:text="${o.branch.name}"></td>
                <td>
                  <span class="badge bg-success bg-opacity-25 text-success rounded-pill px-3 py-2 fw-semibold" th:text="${o.status}"></span>
                </td>
                <td>
                  <strong class="price" th:text="${#numbers.formatDecimal(o.totalAmount,0,'COMMA',0,'POINT')}+' đ'"></strong>
                </td>
                <td class="text-end">
                  <a class="btn btn-outline-primary btn-sm rounded-pill px-3" th:href="@{/orders/{id}(id=${o.id})}">
                    <i class="bi bi-eye me-1"></i> Xem chi tiết
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        
        <div class="text-center py-5" th:if="${orders.empty}">
          <div class="fs-1 mb-2">📦</div>
          <h5 class="fw-bold text-muted mb-2">Bạn chưa có đơn hàng nào</h5>
          <p class="text-secondary small mb-3">Hãy ghé qua cửa hàng để sắm sửa những món đồ yêu thích cho bé cưng nhé!</p>
          <a th:href="@{/products#shop}" class="btn btn-primary rounded-pill px-4 py-2">
            Khám Phá Cửa Hàng Ngay
          </a>
        </div>
      </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </body>
</html>
