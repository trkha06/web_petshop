<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head('Chi tiết đơn')}"></head>
  <body>
    <nav th:replace="~{fragments/navbar :: nav}"></nav>
    <main class="container py-5" style="max-width: 850px">
      <div
        class="alert alert-success"
        th:if="${success}"
        th:text="${success}"
      ></div>
      <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
      <div class="d-flex justify-content-between mb-3">
        <h1 class="h3 fw-bold" th:text="|Đơn hàng #${order.id}|"></h1>
        <span
          class="badge text-bg-success align-self-center"
          th:text="${order.status}"
        ></span>
      </div>
      <div class="panel p-3">
        <div class="row small mb-3">
          <div class="col-md-6"><strong>Ngày tạo:</strong> <span th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></span></div>
          <div class="col-md-6"><strong>Người nhận:</strong> <span th:text="${order.recipientName != null ? order.recipientName : order.customer.fullName}"></span></div>
          <div class="col-md-6"><strong>Email:</strong> <span th:text="${order.recipientEmail != null ? order.recipientEmail : order.customer.email}"></span></div>
          <div class="col-md-6"><strong>Số điện thoại:</strong> <span th:text="${order.recipientPhone != null ? order.recipientPhone : 'Chưa cập nhật'}"></span></div>
          <div class="col-md-6"><strong>Nhận hàng:</strong> <span th:text="${order.deliveryType}"></span></div>
          <div class="col-md-6"><strong>Thanh toán:</strong> <span th:text="${order.paymentMethod}"></span></div>
          <div class="col-12 mt-2"><strong>Địa chỉ:</strong> <span th:text="${order.shippingAddress != null ? order.shippingAddress : 'Chưa cập nhật'}"></span></div>
          <div class="col-12 mt-2" th:if="${order.customerNote != null}"><strong>Ghi chú:</strong> <span th:text="${order.customerNote}"></span></div>
        </div>
        <p
          class="text-muted"
          th:text="|Chi nhánh xử lý: ${order.branch.name}|"
        ></p>
        <table class="table">
          <thead>
            <tr>
              <th>Sản phẩm</th>
              <th>Đơn giá</th>
              <th>SL</th>
              <th>Thành tiền</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="i:${order.items}">
              <td><img th:if="${i.product.imageUrl}" th:src="${i.product.imageUrl}" th:alt="${i.productName}" class="rounded me-2" style="width:40px;height:40px;object-fit:cover"><span th:text="${i.productName}"></span></td>
              <td
                th:text="${#numbers.formatDecimal(i.unitPrice,0,'COMMA',0,'POINT')}+' đ'"
              ></td>
              <td th:text="${i.quantity}"></td>
              <td
                th:text="${#numbers.formatDecimal(i.unitPrice*i.quantity,0,'COMMA',0,'POINT')}+' đ'"
              ></td>
            </tr>
          </tbody>
        </table>
        <div class="row justify-content-end mt-3">
          <div class="col-md-5">
            <div class="d-flex justify-content-between" th:if="${order.subtotalAmount != null}">
              <span>Tạm tính</span>
              <span th:text="${#numbers.formatDecimal(order.subtotalAmount,0,'COMMA',0,'POINT')} + ' đ'"></span>
            </div>
            <div class="d-flex justify-content-between text-success" th:if="${order.discountAmount != null && order.discountAmount.signum() > 0}">
              <span th:text="|Mã ${order.promotionCode}|"></span>
              <span th:text="|-${#numbers.formatDecimal(order.discountAmount,0,'COMMA',0,'POINT')} đ|"></span>
            </div>
            <hr />
            <div class="d-flex justify-content-between price">
              <strong>Tổng thanh toán</strong>
              <strong th:text="${#numbers.formatDecimal(order.totalAmount,0,'COMMA',0,'POINT')} + ' đ'"></strong>
            </div>
          </div>
        </div>
        <form
          th:if="${order.status.name()=='PENDING'}"
          class="mt-3 text-end"
          th:action="@{/orders/{id}/cancel(id=${order.id})}"
          method="post"
        >
          <button class="btn btn-outline-danger">Hủy đơn</button>
        </form>
      </div>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </body>
</html>
